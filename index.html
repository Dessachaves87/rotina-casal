<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12201B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nossa rotina">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<title>Andressa &amp; Ricardo</title>
<script>
/* Porta de entrada: o ícone (com a foto) mora aqui; o painel sincronizado mora no Apps Script.
   Aberto pelo ícone da tela de início → vai direto pro painel.
   Aberto no navegador → mostra como instalar (se redirecionasse, o iPhone instalaria o ícone sem foto). */
var PAINEL = "https://script.google.com/macros/s/AKfycbyYC8pN1CIMF3skhuBlePQQEUX5kkChI1ZOgd4naFJtDu20-ZfqlRtHRiprqwRgtnf6Mw/exec";
var instalado = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
if (instalado) location.replace(PAINEL);
</script>
<style>
  :root{ --fundo:#EDF1EB; --tinta:#12201B; --suave:#4F5E57; --botao:#1F5A43; --cartao:#FFFFFF; }
  @media (prefers-color-scheme: dark){ :root{ --fundo:#12201B; --tinta:#EDF1EB; --suave:#A9B8B0; --botao:#3E8A6B; --cartao:#1B2D26; } }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--fundo); color:var(--tinta);
    font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main{ max-width:420px; width:100%; text-align:center; }
  img{ width:120px; height:120px; border-radius:28px; box-shadow:0 6px 20px rgba(0,0,0,.18); }
  h1{ font-size:26px; margin:20px 0 4px; }
  p{ color:var(--suave); margin:0 0 20px; }
  a.abrir{ display:block; background:var(--botao); color:#fff; text-decoration:none; font-weight:600; padding:14px; border-radius:14px; margin-bottom:24px; }
  ol{ text-align:left; background:var(--cartao); border-radius:14px; padding:16px 16px 16px 36px; margin:0; }
  li{ margin:6px 0; }
</style>
</head>
<body>
<main>
  <img src="icone-512.png" alt="">
  <h1>Andressa &amp; Ricardo</h1>
  <p>A rotina de vocês, sincronizada nos dois celulares.</p>
  <a class="abrir" id="abrir" href="#">Abrir o painel</a>
  <ol>
    <li><b>iPhone:</b> no Safari, toque em Compartilhar › <b>Adicionar à Tela de Início</b>.</li>
    <li><b>Android:</b> no Chrome, menu ⋮ › <b>Adicionar à tela inicial</b>.</li>
    <li>Depois é só abrir pelo ícone com a foto.</li>
  </ol>
</main>
<script>document.getElementById("abrir").href = PAINEL;</script>
</body>
</html>
