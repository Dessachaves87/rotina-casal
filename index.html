<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12201B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nossa rotina">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<title>Andressa &amp; Ricardo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* base */
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}

  :root{
    --ground:#EDF1EB; --surface:#FFFFFF; --surface-2:#E2E9E0; --line:#D2DCD0;
    --ink:#13201B; --ink-2:#51655A; --ink-3:#7C8F84;
    --accent:#2E6B54; --accent-ink:#FFFFFF; --soft:#6E9E99; --grass:#7C9A4F;
    --warn:#A87124; --crit:#9E4238;
    --shadow:0 1px 2px rgba(19,32,27,.06), 0 8px 24px -16px rgba(19,32,27,.35);
    --r:14px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0C1412; --surface:#16211D; --surface-2:#1F2D28; --line:#2B3A34;
      --ink:#E7EEE8; --ink-2:#A0B3A8; --ink-3:#7B8E84;
      --accent:#74B897; --accent-ink:#0C1412; --soft:#8FBDB8; --grass:#A8C177;
      --warn:#D6A55E; --crit:#D4796D;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C1412; --surface:#16211D; --surface-2:#1F2D28; --line:#2B3A34;
    --ink:#E7EEE8; --ink-2:#A0B3A8; --ink-3:#7B8E84;
    --accent:#74B897; --accent-ink:#0C1412; --soft:#8FBDB8; --grass:#A8C177;
    --warn:#D6A55E; --crit:#D4796D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:0 40px}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

  /* ---------- capa ---------- */
  .cover{position:relative; margin-inline:-16px; height:240px; overflow:hidden}
  .cover img{width:100%; height:100%; object-fit:cover; object-position:center 52%; display:block; max-width:100%}
  .cover::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(8,18,14,.05) 0%, rgba(8,18,14,.30) 45%, rgba(8,18,14,.82) 100%);
  }
  .cover-text{position:absolute; left:16px; right:16px; bottom:14px; z-index:1; color:#F2F5F0}
  .cover-text h1{
    font-family:var(--display); font-weight:400; font-size:30px; line-height:1.1;
    margin:0; letter-spacing:-.01em; text-wrap:balance;
    text-shadow:0 1px 14px rgba(0,0,0,.45);
  }
  .cover-sub{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    margin-top:6px; color:#D7E2D6;
  }
  .pill{
    display:inline-block; padding:2px 8px; border-radius:999px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22);
  }
  .pill.local{background:rgba(214,165,94,.28); border-color:rgba(214,165,94,.5)}

  /* ---------- abas ---------- */
  .tabs{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:5;
    display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
    margin-inline:-16px; padding:8px 16px;
    background:color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; border:0; background:transparent; color:var(--ink-2);
    padding:7px 13px; border-radius:999px; cursor:pointer; font-weight:600; font-size:14px;
    transition:background .15s, color .15s;
  }
  .tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}
  .tab .n{font-family:var(--mono); font-size:11px; opacity:.75; margin-left:5px}

  /* ---------- estrutura ---------- */
  section[role="tabpanel"]{padding-top:18px}
  .band{margin-bottom:26px}
  .band-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
  h2{
    font-family:var(--display); font-weight:600; font-size:19px; margin:0;
    letter-spacing:-.01em;
  }
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); margin:0 0 4px;
  }
  .count{font-family:var(--mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

  .list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .row{
    display:flex; align-items:center; gap:12px; background:var(--surface);
    padding:11px 13px; min-height:52px;
  }
  .row-main{flex:1; min-width:0}
  .row-label{font-weight:500; line-height:1.35}
  .row-meta{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:2px; letter-spacing:.02em}
  .row.done .row-label{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-3)}

  .who{
    flex:0 0 auto; font-family:var(--mono); font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-3);
    border:1px solid var(--line); border-radius:999px; padding:1px 7px;
  }
  .time{
    font-family:var(--mono); font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums;
    flex:0 0 auto;
  }

  /* dots de check por pessoa */
  .checks{display:flex; gap:6px; flex:0 0 auto}
  .dot{
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    border:1.5px solid var(--line); background:var(--surface);
    font-family:var(--mono); font-size:12px; font-weight:500; color:var(--ink-3);
    display:grid; place-items:center; transition:background .15s, border-color .15s, color .15s, transform .1s;
  }
  .dot:hover{border-color:var(--accent)}
  .dot:active{transform:scale(.92)}
  .dot[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .dot[disabled]{cursor:default; opacity:.5}
  .dot.cheio{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

  /* medidor de limite */
  .limit{display:flex; align-items:center; gap:12px; background:var(--surface); padding:11px 13px}
  .slots{display:flex; gap:5px}
  .slot{
    width:28px; height:28px; border-radius:8px; cursor:pointer;
    border:1.5px solid var(--line); background:var(--surface-2);
    transition:background .15s, border-color .15s;
  }
  .slot[aria-pressed="true"]{background:var(--warn); border-color:var(--warn)}
  .slot.ok[aria-pressed="true"]{background:var(--grass); border-color:var(--grass)}
  .slot:hover{border-color:var(--ink-3)}
  .limit-left{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .limit-left.full{color:var(--warn); font-weight:500}

  /* semana */
  .weekgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .daycol{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:7px 5px; min-height:112px; display:flex; flex-direction:column; gap:4px;
  }
  .daycol.today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
  .dayname{
    font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-3); text-align:center;
  }
  .daycol.today .dayname{color:var(--accent); font-weight:500}
  .daynum{font-family:var(--mono); font-size:15px; text-align:center; margin-bottom:2px; font-variant-numeric:tabular-nums}
  .chip{
    font-size:10px; line-height:1.25; padding:3px 4px; border-radius:6px;
    background:var(--surface-2); color:var(--ink-2); text-align:center;
    overflow:hidden; text-overflow:ellipsis;
  }
  .chip.a{background:color-mix(in srgb, var(--accent) 16%, var(--surface)); color:var(--ink)}
  .chip.r{background:color-mix(in srgb, var(--soft) 22%, var(--surface)); color:var(--ink)}
  .chip.both{background:color-mix(in srgb, var(--grass) 24%, var(--surface)); color:var(--ink); font-weight:600}

  /* prazos */
  .due{
    flex:0 0 auto; text-align:right; font-family:var(--mono); font-size:11px;
    font-variant-numeric:tabular-nums; line-height:1.3;
  }
  .due b{display:block; font-size:13px; font-weight:500}
  .due.soon b{color:var(--warn)}
  .due.crit b{color:var(--crit)}
  .stripe{width:3px; align-self:stretch; border-radius:2px; background:var(--line); flex:0 0 auto; margin:-11px 0 -11px -13px; margin-right:9px}
  .stripe.soon{background:var(--warn)} .stripe.crit{background:var(--crit)} .stripe.ok{background:var(--grass)}

  /* resumo do dia */
  .today-head{
    display:flex; align-items:center; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:22px;
  }
  .ring{flex:0 0 auto; width:58px; height:58px}
  .today-head .t{flex:1; min-width:0}
  .today-head .t b{font-family:var(--display); font-weight:600; font-size:17px; display:block}
  .today-head .t span{font-size:13px; color:var(--ink-2)}

  .group-label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); margin:16px 0 7px;
  }
  .note{font-size:13px; color:var(--ink-2); margin:10px 2px 0}
  .legend{display:flex; gap:12px; flex-wrap:wrap; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em; margin-top:9px}
  .legend i{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px}

  /* quase lá */
  .quase{
    border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
    overflow:hidden; margin-bottom:20px;
  }
  .quase-cab{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); padding:11px 13px 7px;
  }
  .quase-item{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:9px 13px; border:0; border-top:1px solid var(--line);
    background:var(--surface); cursor:pointer; font:inherit; color:inherit;
  }
  .quase-item:hover{background:var(--surface-2)}
  .quase-item .barra{width:3px; align-self:stretch; border-radius:2px; background:var(--grass); flex:0 0 auto}
  .quase-item.aviso .barra{background:var(--warn)}
  .quase-item .q-label{flex:1; min-width:0; font-weight:500; font-size:14px; line-height:1.3}
  .quase-item .q-onde{font-family:var(--mono); font-size:10px; color:var(--ink-3); display:block; margin-top:1px; letter-spacing:.04em}
  .quase-item .q-val{
    font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
    font-variant-numeric:tabular-nums; flex:0 0 auto; text-align:right;
  }
  .quase-item.aviso .q-val{color:var(--warn)}

  /* peso */
  .peso-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:12px}
  .peso-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px}
  .peso-topo{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .peso-nome{font-family:var(--display); font-weight:600; font-size:16px}
  .peso-alvo{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
  .peso-agora{font-family:var(--mono); font-size:30px; font-variant-numeric:tabular-nums; line-height:1.15; margin-top:4px}
  .peso-agora span{font-size:13px; color:var(--ink-3)}
  .peso-delta{font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:1px; line-height:1.4}
  .peso-svg{width:100%; height:auto; display:block; margin-top:10px; touch-action:pan-y; cursor:crosshair}
  .peso-leitura{font-family:var(--mono); font-size:11px; color:var(--ink-3); min-height:15px; margin-top:2px; font-variant-numeric:tabular-nums}
  .peso-form{display:flex; gap:6px; margin-top:11px}
  .peso-form input{
    flex:1; min-width:0; font:inherit; font-family:var(--mono); font-size:14px;
    padding:8px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--ground); color:var(--ink);
  }
  .peso-form button{
    border:0; background:var(--accent); color:var(--accent-ink); font-weight:600;
    padding:8px 15px; border-radius:10px; cursor:pointer;
  }
  .peso-form button[disabled]{opacity:.45; cursor:default}

  footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-3)}

  @media (max-width:520px){
    .cover{height:200px}
    .cover img{object-position:center 56%}
    .cover-text h1{font-size:25px}
    .weekgrid{grid-template-columns:repeat(7,1fr); gap:3px}
    .daycol{padding:6px 3px; min-height:100px}
    .chip{font-size:9px; padding:2px 3px}
    .row{padding:10px 11px}
    .stripe{margin:-10px 0 -10px -11px; margin-right:8px}
  }
</style>
</head>

const hoje = new Date();

function inicioSemana(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const off = (x.getDay()+6)%7;          // semana começa na segunda
  x.setDate(x.getDate()-off);
  return x;
}
const SEG = inicioSemana(hoje);
const SEMANA = Array.from({length:7},(_,i)=>{ const d=new Date(SEG); d.setDate(SEG.getDate()+i); return d; });
const SEMANA_ID = iso(SEG);

function diasAte(prazoIso){
  const [y,m,d] = prazoIso.split("-").map(Number);
  const alvo = new Date(y, m-1, d);
  const base = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  return Math.round((alvo-base)/86400000);
}
function prazoCurto(prazoIso){
  const [y,m,d] = prazoIso.split("-").map(Number);
  return String(d).padStart(2,"0")+"/"+String(m).padStart(2,"0");
}

/* ===================== estado ===================== */

/* Quando o Apps Script estiver publicado, cole a URL dele aqui (termina em /exec)
   e os dois celulares passam a ver as marcações um do outro. Vazio = cada
   aparelho guarda as suas. */
const SERVIDOR = "";

const vazio = ()=>({dias:{}, semana:{}, mes:{}, casa:{}, saude:{}, pesos:{}});
let estado = vazio();
let podeEscrever = true;
let pendentes = 0;
const CHAVE_LOCAL = "rotina-casal-v1";

const feito      = (data,chave)=> !!(estado.dias[data] && estado.dias[data][chave]);
const slotSemana = chave => !!estado.semana[chave];
const slotMes    = chave => !!estado.mes[chave];
const feitoCasa  = id => !!estado.casa[id];
const feitoSaude = id => !!estado.saude[id];

function lerLocal(){
  try{
    const t = localStorage.getItem(CHAVE_LOCAL);
    if(t) estado = Object.assign(vazio(), JSON.parse(t));
  }catch(e){ /* aparelho sem armazenamento: segue em memória */ }
}
function gravarLocal(){
  try{ localStorage.setItem(CHAVE_LOCAL, JSON.stringify(estado)); }catch(e){}
}

/* uma conversa de cada vez com o servidor */
let fila = Promise.resolve();
function enfileira(tarefa){
  if(!SERVIDOR) return;
  pendentes++; aviso();
  fila = fila.then(tarefa).then(function(){ pendentes--; aviso(); },
    function(erro){ pendentes--; console.error(erro); aviso("não salvou"); });
}
function chamar(acao, dados){
  return fetch(SERVIDOR, {
    method:"POST", redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({acao:acao}, dados))
  }).then(function(r){ return r.json(); });
}

async function gravaDia(data, chave, valor){
  if(!estado.dias[data]) estado.dias[data] = {};
  estado.dias[data][chave] = valor;
  gravarLocal();
  enfileira(function(){ return chamar("gravar", {chave:"dia|"+data+"|"+chave, valor:valor}); });
}
async function gravaSemana(chave, valor){
  estado.semana[chave] = valor;
  gravarLocal();
  enfileira(function(){ return chamar("gravar", {chave:"semana|"+SEMANA_ID+"|"+chave, valor:valor}); });
}
async function gravaMes(chave, valor){
  estado.mes[chave] = valor;
  gravarLocal();
  enfileira(function(){ return chamar("gravar", {chave:"mes|"+MES+"|"+chave, valor:valor}); });
}
async function gravaLista(lista, id, valor){
  estado[lista][id] = valor;
  gravarLocal();
  enfileira(function(){ return chamar("gravar", {chave:lista+"|"+id, valor:valor}); });
}
async function gravaPeso(data, quem, valor){
  if(!estado.pesos[data]) estado.pesos[data] = {};
  if(valor == null) delete estado.pesos[data][quem]; else estado.pesos[data][quem] = valor;
  gravarLocal();
  enfileira(function(){ return chamar("gravarPeso", {data:data, pessoa:quem, kg:valor}); });
}

let avisoFixo = SERVIDOR ? null : "só neste aparelho";
function aviso(texto){
  const p = document.getElementById("modo-pill");
  if(texto !== undefined) avisoFixo = texto;
  const mostrar = (pendentes > 0) ? "salvando" : avisoFixo;
  if(!mostrar){ p.hidden = true; return; }
  p.hidden = false; p.textContent = mostrar;
  p.classList.toggle("local", mostrar !== "salvando");
}

const DESDE = (function(){ const d = new Date(hoje); d.setDate(d.getDate()-50); return iso(d); })();

async function carregar(){
  if(!SERVIDOR) return;
  try{
    const r = await chamar("carregar", {desde:DESDE, semana:SEMANA_ID, mes:MES});
    if(r && r.estado){
      estado = Object.assign(vazio(), r.estado);
      gravarLocal();
      avisoFixo = null; aviso();
      render();
    }
  }catch(erro){ console.error(erro); aviso("sem conexão"); }
}

function anel(pct){
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 40 40"); svg.setAttribute("class","ring");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label", Math.round(pct*100)+"% do dia concluído");
  const fundo = document.createElementNS(ns,"circle");
  fundo.setAttribute("cx","20"); fundo.setAttribute("cy","20"); fundo.setAttribute("r","16.5");
  fundo.setAttribute("fill","none"); fundo.setAttribute("stroke","var(--surface-2)"); fundo.setAttribute("stroke-width","4");
  svg.appendChild(fundo);
  const c = 2*Math.PI*16.5;
  const arco = document.createElementNS(ns,"circle");
  arco.setAttribute("cx","20"); arco.setAttribute("cy","20"); arco.setAttribute("r","16.5");
  arco.setAttribute("fill","none"); arco.setAttribute("stroke","var(--accent)"); arco.setAttribute("stroke-width","4");
  arco.setAttribute("stroke-linecap","round");
  arco.setAttribute("stroke-dasharray", (c*pct).toFixed(1)+" "+c.toFixed(1));
  arco.setAttribute("transform","rotate(-90 20 20)");
  svg.appendChild(arco);
  const t = document.createElementNS(ns,"text");
  t.setAttribute("x","20"); t.setAttribute("y","23.5"); t.setAttribute("text-anchor","middle");
  t.setAttribute("font-size","11"); t.setAttribute("font-family","IBM Plex Mono, monospace");
  t.setAttribute("fill","var(--ink)");
  t.textContent = Math.round(pct*100)+"%";
  svg.appendChild(t);
  return svg;
}

/* ===================== o que está na beirada ===================== */
function itensQuase(){
  const achados = [];

  /* limites da semana com uma pastilha só sobrando — isso é freio */
  LIMITES.forEach(function(lim){
    pessoas(lim.who).forEach(function(q){
      let usados = 0;
      for(let i=0;i<lim.max;i++) if(slotSemana(lim.id+"|"+q+"|"+i)) usados++;
      if(lim.max - usados === 1){
        achados.push({ordem:1, aviso:true, aba:"tab-hoje",
          label:lim.label, onde:NOMES[q].toLowerCase()+" · cota da semana",
          valor:"só mais 1"});
      }
    });
  });

  /* peso a 2 kg ou menos da meta */
  METAS.filter(function(m){ return m.alvo; }).forEach(function(m){
    const pts = pesosDe(m.who);
    if(!pts.length) return;
    const atual = pts[pts.length-1].v;
    const falta = atual - m.alvo;
    if(falta <= 0){
      achados.push({ordem:2, aviso:false, aba:"tab-metas",
        label:"Meta de peso alcançada", onde:NOMES[m.who].toLowerCase()+" · "+m.alvo+" kg",
        valor:fmtKg(atual)+" kg"});
    } else if(falta <= 2){
      achados.push({ordem:2, aviso:false, aba:"tab-metas",
        label:"Peso quase na meta", onde:NOMES[m.who].toLowerCase()+" · meta "+m.alvo+" kg",
        valor:"faltam "+fmtKg(falta)+" kg"});
    }
  });

  /* metas do mês a um passo de fechar */
  MENSAIS.forEach(function(m){
    let feitos = 0;
    for(let i=0;i<m.slots;i++) if(slotMes(m.id+"|"+i)) feitos++;
    if(feitos > 0 && m.slots - feitos === 1){
      achados.push({ordem:3, aviso:false, aba:"tab-metas",
        label:m.label, onde:"meta do mês", valor:"falta 1"});
    }
  });

  /* grupo da casa com um item só sobrando */
  CASA.forEach(function(g){
    const feitos = g.itens.filter(function(i){ return feitoCasa(i.id); }).length;
    if(feitos > 0 && g.itens.length - feitos === 1){
      const resta = g.itens.filter(function(i){ return !feitoCasa(i.id); })[0];
      achados.push({ordem:4, aviso:false, aba:"tab-casa",
        label:resta.label, onde:g.grupo.toLowerCase()+" · último do grupo",
        valor:"falta 1"});
    }
  });

  achados.sort(function(a,b){ return a.ordem - b.ordem; });
  return achados.slice(0, 4);
}

function faixaQuase(){
  const itens = itensQuase();
  if(!itens.length) return null;          /* sem nada perto, a faixa não existe */
  const cx = el("div","quase");
  cx.appendChild(el("div","quase-cab","Quase lá"));
  itens.forEach(function(it){
    const b = el("button","quase-item"+(it.aviso?" aviso":""));
    b.type = "button";
    b.appendChild(el("div","barra"));
    const m = el("div","q-label");
    m.append(it.label);

  });
  return cx;
}

/* ===================== peso ===================== */
function fmtKg(n){ return n.toFixed(1).replace(".", ","); }

function pesosDe(quem){
  return Object.keys(estado.pesos).sort()
    .map(function(d){ return {d:d, v: estado.pesos[d] ? estado.pesos[d][quem] : undefined}; })
    .filter(function(p){ return typeof p.v === "number" && isFinite(p.v); });
}

function graficoPeso(pts, alvo, aoLer){
  const ns="http://www.w3.org/2000/svg";
  const W=320, H=118, ml=6, mr=42, mt=12, mb=18;
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("class","peso-svg");
  svg.setAttribute("role","img");
  const nova = (t,attrs)=>{ const e=document.createElementNS(ns,t); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; };

  const vals = pts.map(p=>p.v).concat([alvo]);
  let min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(max-min < 2){ const c=(max+min)/2; min=c-1; max=c+1; }
  const folga=(max-min)*0.16; min-=folga; max+=folga;
  const y = v => mt + (H-mt-mb) * (1 - (v-min)/(max-min));
  const ms = d => new Date(d+"T00:00:00").getTime();
  const t0 = pts.length ? ms(pts[0].d) : 0;
  const t1 = pts.length ? ms(pts[pts.length-1].d) : 1;
  const x = d => (t1===t0) ? (W-ml-mr)/2 + ml : ml + (W-ml-mr)*(ms(d)-t0)/(t1-t0);
  const dia = d => d.slice(8,10)+"/"+d.slice(5,7);

  svg.appendChild(nova("line",{x1:ml, x2:W-mr, y1:y(alvo), y2:y(alvo),
    stroke:"var(--ink-3)", "stroke-width":1, "stroke-dasharray":"3 3"}));
  const rot = nova("text",{x:W-mr+5, y:y(alvo)+3.5, "font-size":10,
    "font-family":"IBM Plex Mono, monospace", fill:"var(--ink-3)"});
  rot.textContent = "meta"; svg.appendChild(rot);

  if(!pts.length){
    const vazio = nova("text",{x:(W-mr)/2, y:H/2, "text-anchor":"middle", "font-size":11,
      "font-family":"IBM Plex Mono, monospace", fill:"var(--ink-3)"});
    vazio.textContent = "sem registro ainda";
    svg.appendChild(vazio);
    svg.setAttribute("aria-label","Sem registro de peso. Meta de "+alvo+" quilos.");
    return svg;
  }

  if(pts.length>1){
    svg.appendChild(nova("path",{
      d: pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" "),
      fill:"none", stroke:"var(--accent)", "stroke-width":2,
      "stroke-linejoin":"round", "stroke-linecap":"round"}));
  }

  const ult = pts[pts.length-1];
  svg.appendChild(nova("circle",{cx:x(ult.d), cy:y(ult.v), r:4.5,
    fill:"var(--accent)", stroke:"var(--surface)", "stroke-width":2}));
  const valor = nova("text",{x:Math.min(x(ult.d)+9, W-mr+5), y:y(ult.v)+3.5, "font-size":11,
    "font-family":"IBM Plex Mono, monospace", fill:"var(--ink)"});
  valor.textContent = fmtKg(ult.v); svg.appendChild(valor);

  const d1 = nova("text",{x:ml, y:H-5, "font-size":9.5,
    "font-family":"IBM Plex Mono, monospace", fill:"var(--ink-3)"});
  d1.textContent = dia(pts[0].d); svg.appendChild(d1);
  if(pts.length>1){
    const d2 = nova("text",{x:W-mr, y:H-5, "text-anchor":"end", "font-size":9.5,
      "font-family":"IBM Plex Mono, monospace", fill:"var(--ink-3)"});
    d2.textContent = dia(ult.d); svg.appendChild(d2);
  }

  const cruz = nova("line",{y1:mt, y2:H-mb, x1:0, x2:0, stroke:"var(--ink-3)", "stroke-width":1, opacity:0});
  const foco = nova("circle",{cx:0, cy:0, r:5, fill:"none", stroke:"var(--accent)", "stroke-width":2, opacity:0});
  svg.appendChild(cruz); svg.appendChild(foco);

  function ler(ev){
    const r = svg.getBoundingClientRect();
    if(!r.width) return;
    const px = (ev.clientX - r.left) / r.width * W;
    let melhor=pts[0], dist=Infinity;
    pts.forEach(function(pt){ const d=Math.abs(x(pt.d)-px); if(d<dist){ dist=d; melhor=pt; } });
    cruz.setAttribute("x1", x(melhor.d)); cruz.setAttribute("x2", x(melhor.d));
    cruz.setAttribute("opacity", 0.45);
    foco.setAttribute("cx", x(melhor.d)); foco.setAttribute("cy", y(melhor.v));
    foco.setAttribute("opacity", 1);
    aoLer(dia(melhor.d)+" · "+fmtKg(melhor.v)+" kg");
  }
  function limpar(){ cruz.setAttribute("opacity",0); foco.setAttribute("opacity",0); aoLer(""); }
  svg.addEventListener("pointermove", ler);
  svg.addEventListener("pointerdown", ler);
  svg.addEventListener("pointerleave", limpar);

  svg.setAttribute("aria-label",
    "Peso ao longo do tempo. Ultimo registro "+fmtKg(ult.v)+" quilos em "+dia(ult.d)+
    ". Meta de "+alvo+" quilos. "+pts.length+" registros.");
  return svg;
}

function cartaoPeso(quem, alvo){
  const card = el("div","peso-card");
  const pts = pesosDe(quem);
  const atual = pts.length ? pts[pts.length-1].v : null;

  const topo = el("div","peso-topo");
  topo.appendChild(el("div","peso-nome", NOMES[quem]));
  topo.appendChild(el("div","peso-alvo","meta "+alvo+" kg"));
  card.appendChild(topo);

  const agora = el("div","peso-agora");
  if(atual!=null){ agora.append(fmtKg(atual)); const u=el("span"); u.textContent=" kg"; agora.appendChild(u); }
  else agora.append("—");
  card.appendChild(agora);

  const delta = el("div","peso-delta");
  if(atual!=null){
    const faltam = atual - alvo;
    const partes = [Math.abs(faltam)<0.05 ? "na meta"
      : fmtKg(Math.abs(faltam))+" kg "+(faltam>0 ? "acima da meta" : "abaixo da meta")];
    if(pts.length>1){
      const variou = atual - pts[0].v;
      partes.push((variou<=0 ? "−" : "+")+fmtKg(Math.abs(variou))+" kg desde o começo");
    }
    delta.textContent = partes.join(" · ");
  } else {
    delta.textContent = "nenhum registro ainda";
  }
  card.appendChild(delta);

  const leitura = el("div","peso-leitura");
  card.appendChild(graficoPeso(pts, alvo, function(txt){ leitura.textContent = txt; }));
  card.appendChild(leitura);

  const form = el("div","peso-form");
  const inp = document.createElement("input");
  inp.type = "number"; inp.step = "0.1"; inp.min = "20"; inp.max = "300";
  inp.inputMode = "decimal";
  inp.id = "peso-" + quem;
  inp.placeholder = "peso de hoje";
  inp.setAttribute("aria-label", "Peso de hoje de " + NOMES[quem] + ", em quilos");
  const jaHoje = estado.pesos[HOJE] ? estado.pesos[HOJE][quem] : undefined;
  if(typeof jaHoje === "number") inp.value = jaHoje;
  const bt = el("button", null, "Registrar");
  bt.type = "button";
  if(!podeEscrever){ inp.disabled = true; bt.disabled = true; }
  async function registrar(){
    const v = parseFloat(String(inp.value).replace(",", "."));
    if(!isFinite(v) || v<20 || v>300){ inp.focus(); return; }
    bt.disabled = true;
    await gravaPeso(HOJE, quem, Math.round(v*10)/10);
    render();
  }
  bt.addEventListener("click", registrar);
  inp.addEventListener("keydown", function(e){ if(e.key==="Enter") registrar(); });
  form.append(inp, bt);
  card.appendChild(form);
  return card;
}

/* ===================== aba: saúde ===================== */
function desenhaSaude(){
  const p = document.getElementById("p-saude");
  p.replaceChildren();
  const band = el("div","band");
  band.appendChild(Object.assign(el("p","eyebrow"),{textContent:"ordenado pelo que vence primeiro"}));
  const h = el("div","band-head");
  h.appendChild(el("h2",null,"Exames e consultas"));
  const feitos = SAUDE.filter(s=>feitoSaude(s.id)).length;
  h.appendChild(el("span","count", feitos+"/"+SAUDE.length));
  band.appendChild(h);

  const l = el("div","list");
  SAUDE.slice().sort((a,b)=>a.prazo.localeCompare(b.prazo)).forEach(s=>{
    const pronto = feitoSaude(s.id);
    const dd = diasAte(s.prazo);
    const nivel = pronto ? "ok" : dd<=21 ? "crit" : dd<=60 ? "soon" : "";
    const r = el("div","row"+(pronto?" done":""));
    const st = el("div","stripe "+nivel); r.appendChild(st);
    const main = el("div","row-main");
    main.appendChild(el("div","row-label", s.label));
    main.appendChild(el("div","row-meta", (s.who==="both"?"os dois":NOMES[s.who].toLowerCase()) + (s.nota? " · "+s.nota : "")));
    r.appendChild(main);
    const d = el("div","due"+(pronto?"":nivel?" "+nivel:""));
    const b = el("b"); b.textContent = pronto ? "feito" : (dd>=0 ? dd+" dias" : "venceu");
    d.appendChild(b); d.append(prazoCurto(s.prazo));
    r.appendChild(d);
    const btn = el("button","dot", pronto?"✓":"");
    btn.type="button";
    btn.setAttribute("aria-pressed", pronto?"true":"false");
    btn.setAttribute("aria-label", (pronto?"Desmarcar ":"Marcar ")+s.label);
    if(!podeEscrever) btn.disabled = true;
    btn.addEventListener("click", async ()=>{ await gravaLista("saude", s.id, !pronto); render(); });
    r.appendChild(btn);
    l.appendChild(r);
  });
  band.appendChild(l);
  const leg = el("div","legend");
  [["var(--crit)","até 3 semanas"],["var(--warn)","até 2 meses"],["var(--grass)","feito"]].forEach(([cor,txt])=>{
    const s = el("span"); const i = el("i"); i.style.background=cor; s.appendChild(i); s.append(txt); leg.appendChild(s);
  });
  band.appendChild(leg);
  p.appendChild(band);
}

/* ===================== aba: casa ===================== */
function desenhaCasa(){
  const p = document.getElementById("p-casa");
  p.replaceChildren();
  const todos = CASA.flatMap(g=>g.itens);
  const band = el("div","band");
  band.appendChild(Object.assign(el("p","eyebrow"),{textContent:"tarefa com fim — sai da lista quando resolve"}));
  const h = el("div","band-head");
  h.appendChild(el("h2",null,"Pendências da casa"));
  h.appendChild(el("span","count", todos.filter(i=>feitoCasa(i.id)).length+"/"+todos.length));
  band.appendChild(h);
  p.appendChild(band);

  CASA.forEach(g=>{
    const nFeitos = g.itens.filter(i=>feitoCasa(i.id)).length;
    const gl = el("div","group-label", g.grupo+" · "+nFeitos+"/"+g.itens.length);
    p.appendChild(gl);
    const l = el("div","list");
    g.itens.forEach(it=>{
      const pronto = feitoCasa(it.id);
      const r = el("div","row"+(pronto?" done":""));
      const main = el("div","row-main");
      main.appendChild(el("div","row-label", it.label));
      if(it.nota) main.appendChild(el("div","row-meta", it.nota));
      r.appendChild(main);
      const btn = el("button","dot", pronto?"✓":"");
      btn.type="button";
      btn.setAttribute("aria-pressed", pronto?"true":"false");
      btn.setAttribute("aria-label", (pronto?"Desmarcar ":"Marcar ")+it.label);
      if(!podeEscrever) btn.disabled = true;
      btn.addEventListener("click", async ()=>{ await gravaCasaItem(it.id, !pronto); });
      r.appendChild(btn);
      l.appendChild(r);
    });
    p.appendChild(l);
  });
  const nota = el("p","note");
  nota.textContent = "Os seis “ligar” se resolvem numa tarde só, em horário comercial. Os “comprar” pegam carona na ida ao mercado.";
  p.appendChild(nota);
}
async function gravaCasaItem(id, valor){ await gravaLista("casa", id, valor); render(); }

/* ===================== render + abas ===================== */
const ABAS = [
  ["tab-hoje","p-hoje",desenhaHoje],
  ["tab-semana","p-semana",desenhaSemana],
  ["tab-metas","p-metas",desenhaMetas],
  ["tab-saude","p-saude",desenhaSaude],
  ["tab-casa","p-casa",desenhaCasa]
];
let abaAtiva = "tab-hoje";

function render(){
  ABAS.forEach(([tid,pid,fn])=>{
    const painel = document.getElementById(pid);
    const ativa = tid===abaAtiva;
    document.getElementById(tid).setAttribute("aria-selected", ativa?"true":"false");
    painel.hidden = !ativa;
    if(ativa) fn();
  });
  const nS = SAUDE.filter(s=>!feitoSaude(s.id)).length;
  const nC = CASA.flatMap(g=>g.itens).filter(i=>!feitoCasa(i.id)).length;
  document.getElementById("n-saude").textContent = nS ? nS : "";
  document.getElementById("n-casa").textContent = nC ? nC : "";
}

ABAS.forEach(([tid])=>{
  document.getElementById(tid).addEventListener("click", ()=>{ abaAtiva = tid; render(); window.scrollTo({top:0, behavior:"instant"}); });
});

document.getElementById("hoje-data").textContent =
  DIAS[hoje.getDay()]+", "+hoje.getDate()+" de "+MESES[hoje.getMonth()];

lerLocal();
aviso();
render();
carregar();

function recarregaSeParado(){ if(SERVIDOR && !document.hidden && pendentes === 0) carregar(); }
setInterval(recarregaSeParado, 30000);
document.addEventListener("visibilitychange", recarregaSeParado);
</script>
